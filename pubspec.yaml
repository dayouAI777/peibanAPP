name: peiban_app
description: AI 虚拟陪伴 App（自用版，接入 DeepSeek）
publish_to: 'none'
version: 1.6.1+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 全局状态
  provider: ^6.1.5+1
  # 本地存储
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  # 网络：DeepSeek 调用 + 升级包下载
  http: ^1.6.0
  dio: ^5.11.1
  # 在线升级：读本地版本 + 调起安装界面
  package_info_plus: ^10.2.2
  open_filex: ^5.0.0
  # 从相册挑人物参考图
  image_picker: ^1.2.4
  # 纯 Dart 图像处理：给头像压一张"定妆照"小图当身份参考
  image: ^4.5.4
  # 主动消息：预约本地通知
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
